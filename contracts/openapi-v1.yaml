openapi: 3.1.0
info:
  title: Sejong Civil AI API
  version: 4.0.0-draft
  description: |
    Final-scope draft. Validate through discovery/interview before implementation.
    Admin routes are local/private demo surfaces, not public authentication boundaries.
x-admin-exposure-policy: local-private-only-unless-server-gate-approved
x-chat-context-policy:
  mode: client-carried-signed
  ttl-seconds: 900
  server-persistence: none
  raw-transcript-persistence: prohibited
  browser-storage: current-tab-memory-only
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Process health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Required dependencies and seed data ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/chat:
    post:
      operationId: createChatAnswer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Success, follow-up, or safe fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
              example:
                request_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                answer_status: FOLLOWUP
                intent: LOCAL_TAX_GENERAL
                sources: []
                office: null
                followup_options:
                  - 지방세 온라인 납부 공식 경로 안내
                  - 자동차세 개인 고지 확인·납부의 공식 로그인 경로
                  - 지방세 납세증명서 발급 안내
                  - 지방세 세목별 과세증명서 발급 안내
                  - 지방세 납부확인서 발급 안내
                context_token: synthetic-context-token
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/offices:
    get:
      operationId: listOffices
      parameters:
        - in: query
          name: region
          required: true
          schema: { type: string, enum: [아름동, 도담동, 조치원읍] }
        - in: query
          name: intent
          required: true
          schema: { $ref: '#/components/schemas/SupportedIntent' }
      responses:
        '200':
          description: Official office matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficeListResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/failed-questions:
    get:
      operationId: listFailedQuestions
      parameters:
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
        - { in: query, name: reason, schema: { $ref: '#/components/schemas/StoredFailureReason' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/FailedQuestionStatus' } }
      responses:
        '200':
          description: Masked failures only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FailedQuestionListResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/failed-questions/{id}:
    get:
      operationId: getFailedQuestion
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
      responses:
        '200':
          description: Failed question detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FailedQuestionDetailResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '404': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/failed-questions/{id}/reason:
    patch:
      operationId: confirmFallbackReason
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonConfirmationRequest' }
      responses:
        '200':
          description: Reason confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonConfirmationResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '404': { $ref: '#/components/responses/AdminError' }
        '409': { $ref: '#/components/responses/AdminError' }
        '422': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/civic-scope-gaps:
    get:
      operationId: listCivicScopeGaps
      parameters:
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/CivicScopeGapStatus' } }
      responses:
        '200':
          description: Separate masked civic scope-gap review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CivicScopeGapListResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '422': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/civic-scope-gaps/{id}/review:
    patch:
      operationId: reviewCivicScopeGap
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CivicScopeGapReviewRequest' }
      responses:
        '200':
          description: Scope gap marked for planning or dismissal without creating KB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CivicScopeGapReviewResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '404': { $ref: '#/components/responses/AdminError' }
        '409': { $ref: '#/components/responses/AdminError' }
        '422': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/kb-candidates:
    get:
      operationId: listKBCandidates
      parameters: [ { $ref: '#/components/parameters/DemoActorId' }, { $ref: '#/components/parameters/DemoRole' } ]
      responses:
        '200':
          description: Candidate list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCandidateListResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
    post:
      operationId: createKBCandidate
      parameters: [ { $ref: '#/components/parameters/DemoActorId' }, { $ref: '#/components/parameters/DemoRole' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KBCandidateCreate' }
      responses:
        '201':
          description: Draft candidate created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCandidateCreateResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '409': { $ref: '#/components/responses/AdminError' }
        '422': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/kb-candidates/{id}/submit:
    post:
      operationId: submitKBCandidate
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
      responses:
        '200':
          description: Candidate pending approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCandidateSubmitResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '404': { $ref: '#/components/responses/AdminError' }
        '409': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/kb-candidates/{id}/review:
    patch:
      operationId: reviewKBCandidate
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/DemoActorId' }
        - { $ref: '#/components/parameters/DemoRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateReviewRequest' }
      responses:
        '200':
          description: Review applied; approval activates KB atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KBCandidateReviewResponse' }
        '403': { $ref: '#/components/responses/AdminError' }
        '404': { $ref: '#/components/responses/AdminError' }
        '409': { $ref: '#/components/responses/AdminError' }
        '422': { $ref: '#/components/responses/AdminError' }
  /api/v1/admin/quality-summary:
    get:
      operationId: getQualitySummary
      parameters: [ { $ref: '#/components/parameters/DemoActorId' }, { $ref: '#/components/parameters/DemoRole' } ]
      responses:
        '200':
          description: "Values labeled by source: event, evaluation, or mock"
        '403': { $ref: '#/components/responses/AdminError' }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        Optional UUID identifying one logical chat submission across retries. It is
        distinct from the per-HTTP-request correlation request_id. Reusing a completed
        key with the same request replays the stored safe response; reusing it with a
        different request is rejected without echoing input.
      schema: { type: string, format: uuid }
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    DemoActorId:
      in: header
      name: X-Demo-Actor-Id
      required: true
      description: Local/private demo actor only; not an authentication credential.
      schema: { type: string, minLength: 1, maxLength: 100 }
    DemoRole:
      in: header
      name: X-Demo-Role
      required: true
      description: Local/private role switch only; reject when admin routes are not privately gated.
      schema: { type: string, enum: [OPERATOR, APPROVER] }
  responses:
    AdminError:
      description: Stable local/private admin error without request input echo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminErrorEnvelope' }
    ValidationError:
      description: Value-free request validation error without request input echo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorEnvelope' }
    ServiceUnavailable:
      description: No safe response can be produced from approved ACTIVE KB and currently available dependencies.
      headers:
        Retry-After:
          description: Suggested retry delay in seconds.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceUnavailableEnvelope' }
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: 잠시 후 다시 시도해 주세요.
              request_id: 7d444840-9dc0-11d1-b245-5ffdce74fad2
              retryable: true
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ok }
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: ready }
    Intent:
      type: string
      enum: [MOVE_IN_RESIDENT_REGISTRATION, CERTIFICATE_ISSUANCE, BULKY_WASTE, LOCAL_TAX_GENERAL, OUT_OF_SCOPE, UNKNOWN]
    SupportedIntent:
      type: string
      enum: [MOVE_IN_RESIDENT_REGISTRATION, CERTIFICATE_ISSUANCE, BULKY_WASTE, LOCAL_TAX_GENERAL]
    ChatAnswerStatus:
      type: string
      description: SYSTEM_ERROR is represented by the HTTP 503 envelope, not a 200 ChatResponse.
      enum: [SUCCESS, FOLLOWUP, FALLBACK]
    FallbackReason:
      type: string
      enum: [INSUFFICIENT_GROUNDING, PERSONAL_LOOKUP, LEGAL_JUDGMENT, CIVIC_SCOPE_GAP, OUT_OF_SCOPE, PRIVACY_UNRESOLVED]
    StoredFailureReason:
      type: string
      description: OUT_OF_SCOPE and CIVIC_SCOPE_GAP never create a failed_questions row.
      enum: [INSUFFICIENT_GROUNDING, PERSONAL_LOOKUP, LEGAL_JUDGMENT]
    FailedQuestionStatus:
      type: string
      enum: [NEW, REASON_CONFIRMED]
    ServiceUnavailableEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code: { const: SERVICE_UNAVAILABLE }
            message: { type: string, minLength: 1, maxLength: 200 }
            request_id: { type: string, format: uuid }
            retryable: { const: true }
    ValidationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ValidationErrorDetail' }
    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: VALIDATION_ERROR }
        message: { const: 입력값을 확인해 주세요. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    AdminErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/AdminError' }
    AdminError:
      oneOf:
        - { $ref: '#/components/schemas/AdminRouteDisabledError' }
        - { $ref: '#/components/schemas/AdminForbiddenError' }
        - { $ref: '#/components/schemas/AdminNotFoundError' }
        - { $ref: '#/components/schemas/AdminInvalidStateError' }
        - { $ref: '#/components/schemas/AdminValidationFailedError' }
    AdminRouteDisabledError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: ADMIN_ROUTE_DISABLED }
        message: { const: 관리자 기능을 사용할 수 없습니다. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    AdminForbiddenError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: ADMIN_FORBIDDEN }
        message: { const: 이 작업을 수행할 권한이 없습니다. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    AdminNotFoundError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: ADMIN_NOT_FOUND }
        message: { const: 대상을 찾을 수 없습니다. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    AdminInvalidStateError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: ADMIN_INVALID_STATE }
        message: { const: 현재 상태에서는 이 작업을 수행할 수 없습니다. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    AdminValidationFailedError:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { const: ADMIN_VALIDATION_FAILED }
        message: { const: 입력값을 확인해 주세요. }
        request_id: { type: string, format: uuid }
        retryable: { const: false }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        context_token:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
          description: >
            Optional signed conversational context. Clients treat it as opaque and
            keep it only in current-tab memory. Missing, null, expired, invalid,
            or unsupported tokens are treated as no context, not authentication
            failures. The token is never a source of official facts or authority.
        selected_region: { type: [string, 'null'], enum: [아름동, 도담동, 조치원읍, null] }
        simple_language: { type: boolean, default: false }
    Source:
      type: object
      additionalProperties: false
      required: [source_id, title, url, last_verified_at]
      properties:
        source_id: { type: string }
        title: { type: string }
        url: { type: string, format: uri, pattern: '^https://' }
        last_verified_at: { type: string, format: date }
        used_fields: { type: array, items: { type: string } }
    Office:
      type: object
      required: [id, region, office_name, address, phone, source_title, last_verified_at]
      properties:
        id: { type: string }
        region: { type: string }
        office_name: { type: string }
        address: { type: string }
        phone: { type: string }
        opening_hours: { type: [string, 'null'] }
        map_url: { type: [string, 'null'], format: uri, pattern: '^https://' }
        source_title: { type: string }
        source_url: { type: string, format: uri, pattern: '^https://' }
        last_verified_at: { type: string, format: date }
    OfficeListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Office' }
    FallbackPayloadBase:
      type: object
      required: [reason, title, message, candidate_eligible]
      properties:
        reason: { $ref: '#/components/schemas/FallbackReason' }
        title: { type: string }
        message: { type: string }
        next_actions: { type: array, items: { type: string } }
        candidate_eligible: { type: boolean }
        office: { anyOf: [ { $ref: '#/components/schemas/Office' }, { type: 'null' } ] }
    InsufficientGroundingFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, candidate_eligible]
          properties:
            reason: { const: INSUFFICIENT_GROUNDING }
            candidate_eligible: { const: true }
      unevaluatedProperties: false
    PersonalLookupFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, candidate_eligible]
          properties:
            reason: { const: PERSONAL_LOOKUP }
            candidate_eligible: { const: false }
      unevaluatedProperties: false
    LegalJudgmentFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, candidate_eligible]
          properties:
            reason: { const: LEGAL_JUDGMENT }
            candidate_eligible: { const: false }
      unevaluatedProperties: false
    CivicScopeGapFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, candidate_eligible]
          properties:
            reason: { const: CIVIC_SCOPE_GAP }
            candidate_eligible: { const: false }
      unevaluatedProperties: false
    OutOfScopeFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, candidate_eligible]
          properties:
            reason: { const: OUT_OF_SCOPE }
            candidate_eligible: { const: false }
      unevaluatedProperties: false
    PrivacyUnresolvedFallback:
      type: object
      allOf:
        - { $ref: '#/components/schemas/FallbackPayloadBase' }
        - type: object
          required: [reason, title, message, next_actions, candidate_eligible, office]
          properties:
            reason: { const: PRIVACY_UNRESOLVED }
            title: { const: 개인정보를 안전하게 처리하지 못했어요 }
            message: { const: 개인정보를 빼거나 표현을 바꿔서 다시 질문해 주세요. }
            next_actions:
              type: array
              items: { const: '이름, 주소, 전화번호, 접수번호 등을 적지 마세요.' }
              minItems: 1
              maxItems: 1
            candidate_eligible: { const: false }
            office: { type: 'null' }
      unevaluatedProperties: false
    Fallback:
      oneOf:
        - { $ref: '#/components/schemas/InsufficientGroundingFallback' }
        - { $ref: '#/components/schemas/PersonalLookupFallback' }
        - { $ref: '#/components/schemas/LegalJudgmentFallback' }
        - { $ref: '#/components/schemas/CivicScopeGapFallback' }
        - { $ref: '#/components/schemas/OutOfScopeFallback' }
        - { $ref: '#/components/schemas/PrivacyUnresolvedFallback' }
    ChatResponseBase:
      type: object
      required: [request_id, answer_status, intent, sources, context_token]
      properties:
        request_id: { type: string, format: uuid }
        answer_status: { $ref: '#/components/schemas/ChatAnswerStatus' }
        intent: { $ref: '#/components/schemas/Intent' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        summary: { type: [string, 'null'] }
        procedure_steps: { type: array, items: { type: string } }
        required_documents: { type: array, items: { type: string } }
        processing_time: { type: [string, 'null'] }
        fee: { type: [string, 'null'] }
        department: { type: [string, 'null'] }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        followup_options: { type: array, items: { type: string } }
        fallback: { anyOf: [ { $ref: '#/components/schemas/Fallback' }, { type: 'null' } ] }
        context_token:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
          description: >
            Fresh signed 15-minute context for current-tab memory. SUCCESS and
            FOLLOWUP may return a token; FALLBACK always returns null. Never log,
            persist, display, or use it as authentication.
    SuccessResponse:
      type: object
      allOf:
        - { $ref: '#/components/schemas/ChatResponseBase' }
        - type: object
          required: [answer_status, intent, sources, office, answer_mode]
          properties:
            answer_status: { const: SUCCESS }
            intent:
              enum: [MOVE_IN_RESIDENT_REGISTRATION, CERTIFICATE_ISSUANCE, BULKY_WASTE, LOCAL_TAX_GENERAL]
            sources: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Source' } }
            office: { anyOf: [ { $ref: '#/components/schemas/Office' }, { type: 'null' } ] }
            answer_mode: { enum: [GENERATED, TEMPLATE] }
            fallback: { type: 'null' }
            followup_options: { type: array, maxItems: 0 }
      unevaluatedProperties: false
    FollowupResponse:
      type: object
      allOf:
        - { $ref: '#/components/schemas/ChatResponseBase' }
        - type: object
          required: [answer_status, intent, sources, followup_options, office]
          properties:
            answer_status: { const: FOLLOWUP }
            intent:
              enum: [MOVE_IN_RESIDENT_REGISTRATION, CERTIFICATE_ISSUANCE, BULKY_WASTE, LOCAL_TAX_GENERAL, UNKNOWN]
            summary: { type: 'null' }
            procedure_steps: { type: array, maxItems: 0 }
            required_documents: { type: array, maxItems: 0 }
            processing_time: { type: 'null' }
            fee: { type: 'null' }
            department: { type: 'null' }
            sources: { type: array, maxItems: 0 }
            office: { type: 'null' }
            followup_options: { type: array, minItems: 1, items: { type: string } }
            fallback: { type: 'null' }
      unevaluatedProperties: false
    FallbackResponseBase:
      allOf:
        - { $ref: '#/components/schemas/ChatResponseBase' }
        - type: object
          required: [answer_status, intent, sources, fallback, context_token]
          properties:
            answer_status: { const: FALLBACK }
            intent: { $ref: '#/components/schemas/Intent' }
            confidence: { type: 'null' }
            summary: { type: 'null' }
            procedure_steps: { type: array, maxItems: 0 }
            required_documents: { type: array, maxItems: 0 }
            processing_time: { type: 'null' }
            fee: { type: 'null' }
